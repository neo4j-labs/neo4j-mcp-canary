kind: Changed
body: >-
  Rewrote the MCP server's `instructions` field (shown once to connecting
  clients) to describe the tool-discovery workflow instead of naming a fixed
  set of tools. The previous text hardcoded tool names and had already drifted
  — it never mentioned give-feedback, and claimed get-schema surfaces
  full-text/vector indexes, which it doesn't (get-schema runs APOC's
  `apoc.meta.schema`, which has no index field). The new text keeps
  get-schema/read-cypher/write-cypher named as the foundational workflow,
  points out that full-text/vector indexes can still be queried directly via
  `db.index.fulltext.queryNodes()`/`queryRelationships()` and
  `db.index.vector.queryNodes()`/`queryRelationships()` even though get-schema
  won't list them, and tells clients to check the live tool list for anything
  else rather than assuming a fixed set.
