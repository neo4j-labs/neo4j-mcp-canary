kind: Added
body: The openai embedding provider (used by set-vector-property's text field and check-embedding-dimensions) is now generated by this MCP server itself, via a direct HTTP call to an OpenAI-compatible /embeddings endpoint, instead of going through Neo4j's ai.text.embed. An optional configuration.baseUrl key redirects it to any OpenAI-compatible local server (LM Studio, Ollama) with no Neo4j-side GenAI plugin or configuration needed at all. The other three providers (azure-openai, vertexai, bedrock-titan) are unaffected and still generated by Neo4j's ai.text.embed, reusing the auth schemes it already implements.
time: 2026-09-25T15:31:30.947245+01:00
