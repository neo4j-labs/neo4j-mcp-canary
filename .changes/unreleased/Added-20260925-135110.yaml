kind: Added
body: 'Multi-instance HTTP mode''s config file entries can now optionally declare an embedding block naming a Neo4j GenAI plugin provider (openai, azure-openai, vertexai, or bedrock-titan) and its configuration (API credentials, model, etc.). The set-vector-property tool gains a text field: when supplied instead of a pre-computed vector, the server generates the embedding itself via Neo4j''s ai.text.embed function, using that instance''s configured provider, before storing it. There''s no dedicated local-LLM provider, but the openai provider''s target URL is configurable on the Neo4j server itself, so it can be redirected to an OpenAI-compatible local server (e.g. LM Studio, Ollama) - see docs/MULTI_INSTANCE.md. An instance with no embedding configured can still store vectors via the existing vector field.'
