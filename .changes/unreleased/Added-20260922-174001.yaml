kind: Added
body: 'Added a search category with five tools for vector and full-text search: vector-search and fulltext-search run approximate-nearest-neighbor and Lucene-backed queries against existing VECTOR/FULLTEXT indexes via structured fields (no Cypher required), auto-detecting the target node label or relationship type from the index itself; create-vector-index and create-fulltext-index create those indexes, filling the gap create-index intentionally left open; set-vector-property writes an embedding onto a node or relationship via db.create.setNodeVectorProperty/setRelationshipVectorProperty. The category requires a server on calendar 2026.09.0+ or classic 5.27-aura+ (needed for the SEARCH clause''s full-text support) and is automatically excluded from tools/list on older servers rather than failing at call time.'
