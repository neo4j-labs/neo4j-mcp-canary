kind: Fixed
body: >-
  Removed the `vectorIndex`/`fullTextIndex` properties from the `TOOL_USED`
  analytics event. They were populated by parsing an `indexes` field out of
  get-schema's JSON response, but get-schema switched to APOC's
  `apoc.meta.schema` (which has no such field) without updating this parsing
  code, so both properties had silently reported zero on every call since
  that change. `vectorSearch`, `vectorPropertySet`, and `fullTextSearch`
  (detected directly from the Cypher query text, unaffected by that change)
  are still reported.
time: 2026-09-22T10:48:21.34927+01:00
