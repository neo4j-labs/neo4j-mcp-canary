kind: Added
body: >-
  Tools now belong to a mandatory category (cypher, gds, feedback) and carry
  a label (their existing MCP title annotation), exposed as metadata for
  tool selection. Added NEO4J_MCP_ENABLED_TOOLS and
  NEO4J_MCP_ENABLED_TOOL_CATEGORIES to statically narrow the registered tool
  set by name or category at startup. In HTTP mode, a client can further
  narrow the tool set for a single request via the X-MCP-Tools and
  X-MCP-Tool-Categories headers (names configurable via
  NEO4J_MCP_HTTP_TOOLS_HEADER_NAME / NEO4J_MCP_HTTP_TOOL_CATEGORIES_HEADER_NAME);
  a selection can only narrow what NEO4J_READ_ONLY, GDS availability, or the
  static selection already allow, never widen it.
