kind: Added
body: 'Added explain-cypher and profile-cypher tools for query tuning: explain-cypher returns the query plan for a Cypher statement (read or write) without executing it, and profile-cypher executes a statement and returns both the results and a profiled plan with runtime statistics (dbHits, rows, time, page cache hit ratio per operator). Also added five schema-management tools — list-constraints-and-indexes for structured discovery, and create-constraint/drop-constraint/create-index/drop-index for managing uniqueness, key, and property-existence constraints and range/text/point/lookup indexes — all driven by structured fields rather than raw Cypher, so an agent never needs to read or write Cypher DDL syntax to use them. Vector and fulltext indexes are intentionally out of scope for create-index.'
