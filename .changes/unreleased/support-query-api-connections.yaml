kind: Added
body: "The server can now connect to Neo4j over the HTTP-based Query API instead of Bolt, auto-detected from the scheme of NEO4J_URI — http:// or https:// selects the Query API, everything else (bolt://, neo4j://, and their +s/+ssc variants) keeps using the existing Bolt driver, with no new configuration flag required. Query API mode requires Neo4j 2026.07 or newer (calendar-versioned releases) or 5.27-aura or newer (classic-versioned Aura releases only) — one release past the Query API's own general availability (2026.06), since read-cypher's write-query rejection depends on the queryType field Neo4j only introduced in 2026.07; the server checks the connected instance's reported version at startup via an unauthenticated GET to the base URI and refuses to start against an older or unrecognized version. Both STDIO and HTTP transport modes are supported, including HTTP mode's per-request Basic/Bearer credential impersonation. read-cypher, write-cypher, get-schema, and the other Cypher-executing tools behave identically over either wire protocol, including row/byte truncation caps, the EXPLAIN-based write-query rejection in read-cypher, and the planner row-estimate guard. One known limitation: Neo4j's Date/Time/LocalTime/LocalDateTime/OffsetDateTime Cypher types are collapsed to a single decoded shape by the underlying Query API client library, so the JSON rendering of these temporal types in Query API mode is a best-effort approximation rather than an exact match to the Bolt path for every case."
