kind: Changed
body: >-
  Introduced an internal MCP SDK abstraction layer (internal/mcpsdk) and migrated the
  server and all tools from the community mark3labs/mcp-go SDK to the official
  modelcontextprotocol/go-sdk. Tool specs, handlers, request/result types, and the
  server's stdio/HTTP transports and tool-call/handshake hooks now go through this
  internal wrapper instead of importing an MCP SDK directly, so a future breaking
  change in the MCP spec or its SDKs is absorbed in one package instead of rippling
  through every tool and every test tier. This is an internal dependency change with
  no intended effect on tool behavior, schemas, or the wire protocol.
