kind: Added
body: Add an optional TOON (Token-Oriented Object Notation) tool response format, alongside the existing default JSON, via NEO4J_OUTPUT_FORMAT / --neo4j-output-format. TOON reduces LLM token usage versus JSON for the tabular row shapes read-cypher, write-cypher, get-schema, and list-gds-procedures return.
