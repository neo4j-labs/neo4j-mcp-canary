kind: Added
body: >-
  Added custom tools: operators can define their own tools in the config file's
  `custom_tools` list, each with a name, a description that tells the model how
  to use it, a free-form category (for example `crm`), `access` of `read` or
  `readwrite`, a Cypher statement and typed parameters bound as Cypher
  parameters. Read tools run in a read transaction and are refused if their
  statement writes; `readwrite` tools are removed under `NEO4J_READ_ONLY`; the
  category can be used with `NEO4J_MCP_ENABLED_TOOL_CATEGORIES`. Every custom
  tool call emits a `CUSTOM_TOOL` telemetry event carrying only the tool name
  and whether it succeeded. See docs/CUSTOM_TOOLS.md.
  A new `--validate-config` flag checks the whole configuration without starting
  the server, reporting every problem rather than the first (invalid settings,
  unknown config file keys, tool selection that can't take effect and, when a
  connection is possible, whether each custom tool's statement is accepted by
  Neo4j and matches its declared access). It exits with status 1 on errors.
  Unknown config file keys are now also logged as warnings at startup.
