kind: Added
body: "Added a give-feedback tool that lets an agent/LLM submit free-text feedback about the MCP server itself (positive or negative) — for feedback on the server's tools, behaviour, or documentation, not for reporting Cypher/database errors. Feedback is a single string argument capped at 300 characters, enforced both in the advertised tool schema (maxLength) and by the handler. Feedback is sent as a new FEEDBACK Mixpanel event alongside the server's other telemetry, so it is only recorded when telemetry is enabled — the tool call itself always succeeds regardless."
