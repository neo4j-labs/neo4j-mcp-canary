kind: Added
body: >-
  Tool results now carry MCP structured content (structuredContent +
  outputSchema) alongside the existing text block, so a client can consume
  read-cypher/write-cypher/get-schema/list-gds-procedures output
  programmatically instead of re-parsing text. Added markdown as a third
  NEO4J_OUTPUT_FORMAT option, complementary to the existing json/toon choices
  (independent benchmarks on tabular data found Markdown tables scoring
  higher accuracy than TOON despite using more tokens). Because
  structuredContent duplicates the payload already in the text block,
  NEO4J_CYPHER_MAX_BYTES is now enforced as a combined per-call budget for
  read-cypher/write-cypher: the byte cap actually applied during streaming is
  half the configured value, keeping text+structured together under the
  original ~900KB/1MB transport-safety intent.
