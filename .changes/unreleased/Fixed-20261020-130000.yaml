kind: Fixed
body: >-
  The graph, traversal and patterns tools no longer fail silently. An
  update-node, delete-node, update-relationship or delete-relationship call that
  matches nothing (for example a wrong or mistyped id) now returns
  `performed: false` with a message saying nothing matched, instead of
  `performed: true` with `message: null`. A `dryRun` that matches nothing now
  returns `matched: 0` and an explanation instead of an empty result. These
  tools also reject an argument they do not declare, and list the valid ones,
  instead of ignoring it and returning a result that quietly lacks what was
  asked for (for example `neighborProperties` instead of `nodeProperties`).
  find-shortest-path and find-all-paths now say in their descriptions that
  nodes carry only id and labels unless `nodeProperties` is passed.
