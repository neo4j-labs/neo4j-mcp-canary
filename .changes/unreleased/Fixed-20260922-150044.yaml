kind: Fixed
body: 'write-cypher no longer silently mishandles EXPLAIN- or PROFILE-prefixed queries: an EXPLAIN prefix previously returned an empty, misleadingly successful-looking result (EXPLAIN produces no rows), and a PROFILE prefix executed the query but silently discarded the resulting profiling data. Both are now rejected with a message pointing at the new explain-cypher and profile-cypher tools.'
time: 2026-09-22T15:00:44.875237+01:00
