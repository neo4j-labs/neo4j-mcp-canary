kind: Added
body: 'Added multi-instance HTTP mode: a config file can now declare a neo4j_instances list, each with its own Neo4j connection details and auth, letting one running server serve several Neo4j instances at once. A client selects an instance via its own URL path ("/<name>/mcp"), never a header or query param, so each instance''s identity and auth are unambiguous. Three connection-auth types are supported per instance: basic (a static service-account username/password baked into that instance''s driver, gated by a required client-presented API key so nobody can ride on the shared account unauthenticated), basic_passthrough (the client''s own HTTP Basic credentials are forwarded to Neo4j, exactly like existing single-instance HTTP mode), and bearer (the client''s Bearer token is verified against that instance''s configured identity provider''s JWKS endpoint - issuer, audience, signature, and expiry - before being forwarded to Neo4j). Bearer-type instances also serve their own RFC 9728 protected-resource metadata document, so a spec-compliant MCP client can discover which identity provider to log in with before ever presenting a token. The instances list is deliberately configurable only via the config file, never an environment variable or CLI flag, since it is inherently a list rather than a single value; config-file secrets may reference ${ENV_VAR} for interpolation alongside plaintext values.'
